# Development: a developer's PC, started with `docker compose up -d --build` (ADR 0002).

# Local database. The password "noa" is a dev-only value; staging and prod refuse it at startup.
spring.datasource.url=jdbc:postgresql://localhost:5432/mandujoa
spring.datasource.username=mandujoa
spring.datasource.password=noa

# Status screen (/status) and API (/api/status/database). No login exists yet.
app.status.enabled=true

# The scheduled retention job does not run on a developer's PC.
app.retention.enabled=false

logging.level.com.example.helloworld=DEBUG
