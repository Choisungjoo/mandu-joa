spring.application.name=helloworld
server.address=localhost
server.port=8080

# --- Profiles (ADR 0002) ---------------------------------------------------
# Settings shared by every environment live here. What differs lives in
# application-dev.properties, application-staging.properties and
# application-prod.properties. A run without SPRING_PROFILES_ACTIVE uses dev;
# staging and production servers always set the profile explicitly.
spring.profiles.default=dev

# --- Database -------------------------------------------------------------
# Connection settings are per profile. Override with SPRING_DATASOURCE_URL /
# _USERNAME / _PASSWORD (see compose.yaml).
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Data retention -------------------------------------------------------
# Provider content (review text, reviewer names, raw payloads) is purged per
# provider using integration_providers.content_retention_days. These settings
# cover operational data that we generate ourselves. Whether the scheduled job
# runs (app.retention.enabled) is set per profile.
app.retention.cron=0 30 3 * * *
app.retention.sync-run-days=180
app.retention.sync-error-days=90
app.retention.audit-event-days=730
