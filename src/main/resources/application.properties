spring.application.name=helloworld
server.address=localhost
server.port=8080

# --- Database -------------------------------------------------------------
# Override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (see compose.yaml).
spring.datasource.url=jdbc:postgresql://localhost:5432/noa
spring.datasource.username=noa
spring.datasource.password=noa

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Data retention -------------------------------------------------------
# Provider content (review text, reviewer names, raw payloads) is purged per
# provider using integration_providers.content_retention_days. These settings
# cover operational data that we generate ourselves.
app.retention.enabled=true
app.retention.cron=0 30 3 * * *
app.retention.sync-run-days=180
app.retention.sync-error-days=90
app.retention.audit-event-days=730

# --- Status screen (/status) and API (/api/status/database) ---------------
# No authentication exists yet; disable this before exposing the app publicly.
app.status.enabled=true
