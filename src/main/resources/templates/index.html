<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f6f8fb;
      color: #172033;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, calc(100% - 48px));
      padding: 56px;
      border: 1px solid #e1e7f0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 50px rgba(23, 32, 51, .08);
    }
    .tag { color: #2864dc; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: 1; }
    p { margin: 0; color: #526176; font-size: 1.125rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Spring Boot + Maven</div>
    <h1>Hello, World!</h1>
    <p>Your Java web app is running locally.</p>
  </main>
</body>
</html>
