# Staging: a server set up like production, used by the team with test accounts (ADR 0002).

# The database URL and user come from SPRING_DATASOURCE_URL and SPRING_DATASOURCE_USERNAME.
# The password has no default: without DB_PASSWORD (or SPRING_DATASOURCE_PASSWORD) the app does not start.
spring.datasource.password=${DB_PASSWORD}

# Off by default. Set APP_STATUS_ENABLED=true only while diagnosing a problem:
# the screen has no login yet, so restrict it to known IPs in NGINX while it is on.
app.status.enabled=false

app.retention.enabled=true

logging.level.com.example.helloworld=INFO
