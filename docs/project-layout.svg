<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- background (explicit so it reads in GitHub dark mode) -->
  <rect x="0" y="0" width="680" height="660" rx="16" fill="#ffffff"/>

  <!-- ===== Backend ===== -->
  <rect x="24" y="22" width="632" height="306" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="40" y="34" width="210" height="24" rx="12" fill="#16a34a"/>
  <text x="145" y="51" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Backend · Spring Boot (Java 17)</text>

  <text x="44" y="88" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="700" fill="#14532d">src/main/java/com/example/helloworld/</text>

  <!-- tree connectors -->
  <g stroke="#86efac" stroke-width="1.6" fill="none">
    <line x1="56" y1="96" x2="56" y2="303"/>
    <line x1="56" y1="113" x2="74" y2="113"/>
    <line x1="56" y1="140" x2="74" y2="140"/>
    <line x1="56" y1="167" x2="74" y2="167"/>
    <line x1="56" y1="194" x2="74" y2="194"/>
    <line x1="56" y1="221" x2="74" y2="221"/>
    <line x1="56" y1="248" x2="74" y2="248"/>
    <line x1="56" y1="275" x2="74" y2="275"/>
    <line x1="56" y1="302" x2="74" y2="302"/>
  </g>

  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="600" fill="#0f172a">
    <text x="82" y="118">organization/</text>
    <text x="82" y="145">integration/</text>
    <text x="82" y="172">review/</text>
    <text x="82" y="199">sync/</text>
    <text x="82" y="226">audit/</text>
    <text x="82" y="253">retention/</text>
    <text x="82" y="280">status/</text>
    <text x="82" y="307">persistence/</text>
  </g>
  <g font-size="13" fill="#475569">
    <text x="330" y="118">Organizations, users, memberships</text>
    <text x="330" y="145">Providers, connected accounts, business locations</text>
    <text x="330" y="172">Reviews, interactions, drafts, publications, upserter</text>
    <text x="330" y="199">Polling configs, cursors, sync runs and errors</text>
    <text x="330" y="226">Audit events (append-only)</text>
    <text x="330" y="253">Scheduled retention purge</text>
    <text x="330" y="280">Database status API</text>
    <text x="330" y="307">Shared entity base class</text>
  </g>

  <!-- ===== Database ===== -->
  <rect x="24" y="344" width="632" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="356" width="90" height="24" rx="12" fill="#2563eb"/>
  <text x="85" y="373" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Database</text>
  <text x="44" y="408" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="600" fill="#0f172a">src/main/resources/db/migration/</text>
  <text x="330" y="408" font-size="13" fill="#475569">Flyway SQL migrations (V1 – V5)</text>

  <!-- ===== Frontend ===== -->
  <rect x="24" y="440" width="632" height="80" rx="12" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="40" y="452" width="90" height="24" rx="12" fill="#0891b2"/>
  <text x="85" y="469" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Frontend</text>
  <text x="44" y="504" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="600" fill="#0f172a">frontend/</text>
  <text x="330" y="504" font-size="13" fill="#475569">React + TypeScript status screen (Vite)</text>

  <!-- ===== Infrastructure & docs ===== -->
  <rect x="24" y="536" width="632" height="106" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="40" y="548" width="170" height="24" rx="12" fill="#ea580c"/>
  <text x="125" y="565" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Infrastructure &amp; docs</text>
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="600" fill="#0f172a">
    <text x="44" y="598">compose.yaml</text>
    <text x="44" y="625">nginx/default.conf</text>
    <text x="400" y="598">Dockerfile</text>
    <text x="400" y="625">docs/</text>
  </g>
  <g font-size="13" fill="#475569">
    <text x="200" y="598">NGINX + app + PostgreSQL</text>
    <text x="200" y="625">Reverse proxy config</text>
    <text x="500" y="598">App container image</text>
    <text x="500" y="625">README diagrams</text>
  </g>
</svg>
