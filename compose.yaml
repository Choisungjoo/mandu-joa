name: mandujoa

services:
  postgres:
    image: postgres:17-alpine
    container_name: mandujoa_postgres
    environment:
      POSTGRES_DB: mandujoa
      POSTGRES_USER: mandujoa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noa}
    volumes:
      # Named volume: data survives container restarts and `docker compose down`.
      - postgres-data:/var/lib/postgresql/data
    # Reachable only inside the Compose network; no host port is published.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandujoa -d mandujoa"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    container_name: mandujoa_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # This Compose file is the local dev setup (ADR 0002). Staging and prod set their own profile.
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mandujoa
      SPRING_DATASOURCE_USERNAME: mandujoa
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-noa}
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mandujoa_nginx
    depends_on:
      - app
    ports:
      # Set NGINX_PORT if port 80 is taken by something else.
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Without this, nginx stays down after Docker Desktop restarts while app and postgres come back.
    restart: unless-stopped

volumes:
  postgres-data:
    name: mandujoa_postgres-data
